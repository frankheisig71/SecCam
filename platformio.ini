; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-cam-edge-impulse-eval

[env:esp32-s3-cam-edge-impulse]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.sdkconfig_path = sdkconfig.esp32-s3-cam-edge-impulse
board_build.partitions = partitions_16mb_singleapp.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 11468800
board_upload.speed = 921600
board_build.psram_type = opi
extra_scripts = pre:scripts/remote_pi.py
build_flags =
	-Wno-maybe-uninitialized
	-I.
	-Iedge_impulse
	-DAPP_EDGE_IMPULSE_MODEL_ROOT=\"edge_impulse/Person_detection_inferencing\"
	-Iedge_impulse/Person_detection_inferencing/src
	-DAPP_CAPTURE=1
	-DAPP_CAPTURE_ON_STARTUP=0
	-DAPP_CAMERA_FRAME_SIZE_PSRAM=FRAMESIZE_VGA
	-DAPP_CAMERA_FRAME_SIZE_NO_PSRAM=FRAMESIZE_VGA
	-DAPP_CAPTURE_TRIGGER_IR_SAVE_CYCLES=3
	-DAPP_CAPTURE_IR_LED_SKIP_FRAMES_COUNT=3

[env:esp32-s3-cam-edge-impulse-eval]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.sdkconfig_path = sdkconfig.esp32-s3-cam-edge-impulse
board_build.partitions = partitions_16mb_singleapp.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 11468800
board_upload.speed = 921600
board_build.psram_type = opi
extra_scripts = pre:scripts/remote_pi.py
build_flags =
	-Wno-maybe-uninitialized
    -Wno-deprecated
    -Wno-deprecated-declarations
    -Wno-missing-field-initializers
    -Wno-unused-parameter
	-I.
	-Iedge_impulse
	-DAPP_EDGE_IMPULSE_MODEL_ROOT=\"edge_impulse/Person_detection_inferencing\"
	-Iedge_impulse/Person_detection_inferencing/src
	-DAPP_CAPTURE=1
	-DAPP_CAPTURE_ON_STARTUP=0
	-DAPP_CAMERA_FRAME_SIZE_PSRAM=FRAMESIZE_SVGA
	-DAPP_CAMERA_FRAME_SIZE_NO_PSRAM=FRAMESIZE_SVGA
	-DAPP_CAMERA_JPEG_QUALITY=6
	-DAPP_CAPTURE_TRIGGER_IR_SAVE_CYCLES=3
	-DAPP_CAPTURE_IR_LED_SKIP_FRAMES_COUNT=3
	-DAPP_PERSON_DETECT_MODEL_REQUIRED=0

