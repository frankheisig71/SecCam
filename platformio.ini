; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-cam-edge-impulse]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.sdkconfig_path = sdkconfig.esp32-s3-cam-edge-impulse
board_build.partitions = partitions_16mb_singleapp.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 11468800
board_upload.speed = 921600
board_build.psram_type = opi
build_flags =
	-DAPP_PERSON_DETECT_BACKEND=APP_PERSON_DETECT_BACKEND_EDGE_IMPULSE
	-DAPP_CAPTURE_ON_STARTUP=0

[env:esp32-s3-cam-capture]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.sdkconfig_path = sdkconfig.esp32-s3-cam-edge-impulse
board_build.partitions = partitions_16mb_singleapp.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 11468800
board_upload.speed = 921600
board_build.psram_type = opi
build_flags =
	-DAPP_WIFI_MODE=APP_WIFI_MODE_STA
	-DAPP_HTTP_SERVER_ENABLED=0
	-DAPP_PERSON_DETECT_ENABLED=0
	-DAPP_DATASET_COLLECTOR_ENABLED=1
	-DAPP_CAPTURE_ON_STARTUP=0
	-DAPP_CAMERA_FRAME_SIZE_PSRAM=FRAMESIZE_VGA
	-DAPP_CAMERA_FRAME_SIZE_NO_PSRAM=FRAMESIZE_VGA

[env:esp32-s3-cam-setup]
platform = espressif32 @ 6.13.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.sdkconfig_path = sdkconfig.esp32-s3-cam-edge-impulse
board_build.partitions = partitions_16mb_singleapp.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 11468800
board_upload.speed = 921600
board_build.psram_type = opi
build_flags =
	-DAPP_SETUP_PROJECT=1
	-DAPP_WIFI_MODE=APP_WIFI_MODE_AP
	-DAPP_HTTP_SERVER_ENABLED=1
	-DAPP_PERSON_DETECT_ENABLED=0
	-DAPP_DATASET_COLLECTOR_ENABLED=0
	-DAPP_CAPTURE_ON_STARTUP=0
	-DAPP_CAMERA_TRIGGER_FRAMES=1
	-DAPP_CAMERA_FRAME_SIZE_PSRAM=FRAMESIZE_VGA
	-DAPP_CAMERA_FRAME_SIZE_NO_PSRAM=FRAMESIZE_VGA

